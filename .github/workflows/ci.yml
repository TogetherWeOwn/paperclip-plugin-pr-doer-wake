name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Per-commit group outside PRs: a group keeps one pending run, so a shared
  # main group would drop the checks of a queued push.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  phase-state-unit:
    name: Phase state and rejected launch inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      # Inert temporary directories and rejected inputs only.
      - run: |
          cc -std=c11 -Wall -Wextra -Werror qualification/synthetic-fence/phase-state.c qualification/synthetic-fence/phase-state.test.c -Wl,--wrap=getrandom -o "$RUNNER_TEMP/phase-state-test"
          timeout 10s "$RUNNER_TEMP/phase-state-test"
          cc -std=c11 -Wall -Wextra -Werror qualification/synthetic-fence/gated-launch.c qualification/synthetic-fence/cgroup-membership.c qualification/synthetic-fence/gated-launch-test.c -o "$RUNNER_TEMP/gated-launch-test"
          timeout 10s "$RUNNER_TEMP/gated-launch-test"

  cgroup-membership-parser:
    name: Cgroup membership parser unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      # Pure byte parsing only; no process or cgroup fixture is launched.
      - run: |
          set -eu
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            qualification/synthetic-fence/cgroup-membership.c \
            qualification/synthetic-fence/cgroup-membership.test.c \
            -o "$RUNNER_TEMP/cgroup-membership-test"
          timeout 10s "$RUNNER_TEMP/cgroup-membership-test"
  gated-launch-behavior:
    name: Gated launch kernel behavior
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      # Disposable hosted runner only: no protected runtime or controller.
      - run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Werror qualification/synthetic-fence/gated-launch-signal-test.c qualification/synthetic-fence/cgroup-membership.c -o "$RUNNER_TEMP/gated-launch-signal-test"
          timeout --kill-after=2s 10s "$RUNNER_TEMP/gated-launch-signal-test"
          cc -std=c11 -Wall -Wextra -Werror -pthread qualification/synthetic-fence/gated-launch.c qualification/synthetic-fence/cgroup-membership.c qualification/synthetic-fence/gated-launch-behavior.c -o "$RUNNER_TEMP/gated-launch-behavior"
          group="/sys/fs/cgroup/gated-launch-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          marker="$RUNNER_TEMP/gated-launch-marker"
          sudo mkdir "$group"
          cleanup() { sudo rmdir "$group"; sudo rm -f -- "$marker"; }
          trap cleanup EXIT
          sudo timeout --kill-after=5s 30s unshare --pid --fork --mount-proc --kill-child "$RUNNER_TEMP/gated-launch-behavior" "$group" "$marker"
  synthetic-cgroup-capability:
    name: Synthetic cgroup capability probe
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Probe delegated scope and recursive termination
        env:
          REQUESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -o pipefail
          {
            printf 'requested_sha=%s\ncheckout_sha=%s\nrun=%s attempt=%s job=%s\n' "$REQUESTED_SHA" "$(git rev-parse HEAD)" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_JOB"
            test "$(git rev-parse HEAD)" = "$REQUESTED_SHA" || exit 1
            sudo systemd-run --wait --pipe --uid="$(id -u)" --unit="fixture-cgroup-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" -p Delegate=yes \
              -p "WorkingDirectory=$GITHUB_WORKSPACE" \
              env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
              python3 -I qualification/synthetic-fence/cgroup-capability.py
          } 2>&1 | tee "$RUNNER_TEMP/cgroup-capability.log"
      - name: Retain probe evidence, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cgroup-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cgroup-capability.log
          if-no-files-found: warn
          retention-days: 7

  synthetic-image-validation:
    name: Synthetic image inspection checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      # Pure synthetic fixtures only; this does not launch or qualify a container.
      - run: python3 -I qualification/cross-version/test_inspect_image.py

  ownership-ledger:
    name: Synthetic ownership accounting
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      # Supplied observations only; no process or cgroup fixture is launched.
      - run: |
          set -eu
          cc -std=c11 -Wall -Wextra -Werror -pedantic -c \
            qualification/synthetic-fence/ownership-ledger.c \
            -o "$RUNNER_TEMP/ownership-ledger.o"
          if nm "$RUNNER_TEMP/ownership-ledger.o" | grep -E '(^|[[:space:]])(wait|waitpid|waitid|wait3|wait4|ownership_drain[^[:space:]]*)$'; then
            exit 1
          fi
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            "$RUNNER_TEMP/ownership-ledger.o" \
            qualification/synthetic-fence/ownership-ledger.test.c \
            -o "$RUNNER_TEMP/ownership-ledger-test"
          timeout 10s "$RUNNER_TEMP/ownership-ledger-test"

  custody-parser-baseline:
    name: Custody parser pinned regression control
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: c113f7300ee8d9fe86002a7850d7ca735b61dd23
          path: baseline
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - working-directory: candidate
        run: npm ci --ignore-scripts
      - name: Verify failing-before and corrected parser behavior
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(git -C ../baseline rev-parse HEAD)" = c113f7300ee8d9fe86002a7850d7ca735b61dd23
          cp src/custody-policy.ts "$RUNNER_TEMP/custody-policy.ts"
          cp ../baseline/src/custody-policy.ts src/custody-policy.ts
          set +e
          npx vitest run tests/custody-policy.test.ts -t 'suppresses protected directives' --reporter=json --outputFile="$RUNNER_TEMP/baseline.json"
          result=$?
          set -e
          cp "$RUNNER_TEMP/custody-policy.ts" src/custody-policy.ts
          test "$result" -eq 1
          node -e 'const r=require(process.argv[1]); const t=r.testResults.flatMap(f=>f.assertionResults).filter(t=>t.fullName.includes("suppresses protected directives") && t.status==="failed"); if(t.length!==3 || t.some(x=>!x.failureMessages.some(m=>m.includes("to be null")))) process.exit(1); console.log("separator regressions:", t.length)' "$RUNNER_TEMP/baseline.json"
          npx vitest run tests/custody-policy.test.ts -t 'suppresses protected directives'

  reviewer-rollback-baseline:
    name: Reviewer rollback pinned regression control
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: c7982fcbdc88e150ce6f26ec1f2cb06df07ee8f8
          path: baseline
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - working-directory: candidate
        run: npm ci --ignore-scripts
      - name: Verify issue-read rollback fails before the fix
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(git -C ../baseline rev-parse HEAD)" = c7982fcbdc88e150ce6f26ec1f2cb06df07ee8f8
          cp src/ci-runtime.ts "$RUNNER_TEMP/ci-runtime.ts"
          trap 'cp "$RUNNER_TEMP/ci-runtime.ts" src/ci-runtime.ts' EXIT
          cp ../baseline/src/ci-runtime.ts src/ci-runtime.ts
          set +e
          npx vitest run tests/ci-runtime.test.ts -t 'aborts on issue read rollback of enabled' --reporter=json --outputFile="$RUNNER_TEMP/reviewer-baseline.json"
          result=$?
          set -e
          test "$result" -eq 1
          node -e 'const r=require(process.argv[1]); const t=r.testResults.flatMap(f=>f.assertionResults).filter(t=>t.fullName.includes("aborts on issue read rollback of enabled")); if(t.length!==1 || t[0].status!=="failed" || !t[0].failureMessages.some(m=>m.includes("not be called"))) process.exit(1); console.log("expected stale-authority wake observed")' "$RUNNER_TEMP/reviewer-baseline.json"
          cp "$RUNNER_TEMP/ci-runtime.ts" src/ci-runtime.ts
          npx vitest run tests/ci-runtime.test.ts -t 'aborts on issue read rollback of enabled'

  stock-host-sql:
    name: Stock host SQL fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: fixture
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d fixture"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: paperclipai/paperclip
          ref: d69631b01b9c658f80bf8bed389863dce82643e1 # v2026.1106.0
          path: stock-host
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - working-directory: candidate
        run: npm ci --ignore-scripts
      - working-directory: candidate
        env:
          HOST_SQL_SOURCE: ../stock-host/server/src/services/plugin-database.ts
          RELEASE_TEST_DATABASE: postgresql://postgres:fixture@localhost:5432/fixture
        # Both files create the same synthetic namespace; avoid concurrent schema creation.
        run: npx vitest run --no-file-parallelism tests/stock-host-fixture.test.ts tests/release-store-host.test.ts

  check:
    needs: [cgroup-membership-parser, gated-launch-behavior, phase-state-unit, stock-host-sql]
    if: ${{ always() }}
    # Required status check on main. Renaming this changes the check context
    # and blocks every merge until the ruleset is updated to match.
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require parser test success
        env:
          PARSER_RESULT: ${{ needs.cgroup-membership-parser.result }}:${{ needs.gated-launch-behavior.result }}:${{ needs.phase-state-unit.result }}:${{ needs.stock-host-sql.result }}
        run: test "$PARSER_RESULT" = success:success:success:success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build the PR head itself, not GitHub's synthetic merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: node --test tests/package-artifact.test.mjs
      - name: Pack and validate installable package
        run: node scripts/retain-package.mjs "$RUNNER_TEMP/ci-wake-artifact"
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Retain validated package and provenance
        id: package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-wake-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-wake-artifact/
          if-no-files-found: error
          retention-days: 30
          overwrite: false
      - name: Record archive receipt
        env:
          ARTIFACT_ID: ${{ steps.package.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.package.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.package.outputs.artifact-digest }}
        run: |
          test -n "$ARTIFACT_ID" && test -n "$ARTIFACT_URL" && test -n "$ARTIFACT_DIGEST"
          {
            printf '## Retained package\n\nArtifact ID: `%s`\n\nURL: %s\n\nArchive SHA-256: `%s`\n\n' "$ARTIFACT_ID" "$ARTIFACT_URL" "$ARTIFACT_DIGEST"
            printf 'Requested retention: 30 days; verify actual expires_at through the artifact API.\n\n'
            printf 'Require this run/job to finish successfully. PR bundles are not merged-source or host acceptance.\n\n'
            printf '### Bundle checksums\n\n```text\n'
            cat "$RUNNER_TEMP/ci-wake-artifact/SHA256SUMS"
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"

  sdk-compat:
    name: SDK 2026.1106.0 compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      # Isolated fixture override; does not alter the lockfile or qualify installed bytes.
      - run: npm install --no-save --ignore-scripts @paperclipai/plugin-sdk@2026.1106.0 @paperclipai/shared@2026.1106.0
      - name: Verify exact SDK and shared versions
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          for (const name of ['plugin-sdk', 'shared']) {
            const pkg = JSON.parse(readFileSync(`node_modules/@paperclipai/${name}/package.json`, 'utf8'));
            if (pkg.version !== '2026.1106.0') throw new Error('unexpected SDK fixture version');
            console.log(`${pkg.name}@${pkg.version}`);
          }
          JS
      - run: npm run check
      - run: git diff --exit-code -- package.json package-lock.json
