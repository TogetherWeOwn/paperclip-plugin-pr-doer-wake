name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Per-commit group outside PRs: a group keeps one pending run, so a shared
  # main group would drop the checks of a queued push.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # Required status check on main. Renaming this changes the check context
    # and blocks every merge until the ruleset is updated to match.
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  sdk-compat:
    name: SDK 2026.1106.0 compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      # Isolated fixture override; does not alter the lockfile or qualify installed bytes.
      - run: npm install --no-save --ignore-scripts --package-lock=false @paperclipai/plugin-sdk@2026.1106.0 @paperclipai/shared@2026.1106.0
      - name: Verify exact SDK and shared versions
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          for (const name of ['plugin-sdk', 'shared']) {
            const pkg = JSON.parse(readFileSync(`node_modules/@paperclipai/${name}/package.json`, 'utf8'));
            if (pkg.version !== '2026.1106.0') throw new Error('unexpected SDK fixture version');
            console.log(`${pkg.name}@${pkg.version}`);
          }
          JS
      - run: npm run check
      - run: git diff --exit-code -- package.json package-lock.json
