name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Per-commit group outside PRs: a group keeps one pending run, so a shared
  # main group would drop the checks of a queued push.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  phase-state-unit:
    name: Phase state filesystem unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      # Inert temporary directories only: no cgroup or worker execution.
      - run: |
          cc -std=c11 -Wall -Wextra -Werror qualification/synthetic-fence/phase-state.c qualification/synthetic-fence/phase-state.test.c -Wl,--wrap=getrandom -o "$RUNNER_TEMP/phase-state-test"
          "$RUNNER_TEMP/phase-state-test"

  gated-launch-parser:
    name: Gated launch parser unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      # Parser and rejected-input tests only; no child or cgroup execution.
      - run: |
          cc -std=c11 -Wall -Wextra -Werror qualification/synthetic-fence/gated-launch.c qualification/synthetic-fence/gated-launch-test.c -o "$RUNNER_TEMP/gated-launch-test"
          "$RUNNER_TEMP/gated-launch-test"

  synthetic-image-validation:
    name: Synthetic image inspection checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      # Pure synthetic fixtures only; this does not launch or qualify a container.
      - run: python3 -I qualification/cross-version/test_inspect_image.py

  custody-parser-baseline:
    name: Custody parser pinned regression control
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: c113f7300ee8d9fe86002a7850d7ca735b61dd23
          path: baseline
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - working-directory: candidate
        run: npm ci --ignore-scripts
      - name: Verify failing-before and corrected parser behavior
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(git -C ../baseline rev-parse HEAD)" = c113f7300ee8d9fe86002a7850d7ca735b61dd23
          cp src/custody-policy.ts "$RUNNER_TEMP/custody-policy.ts"
          cp ../baseline/src/custody-policy.ts src/custody-policy.ts
          set +e
          npx vitest run tests/custody-policy.test.ts -t 'suppresses protected directives' --reporter=json --outputFile="$RUNNER_TEMP/baseline.json"
          result=$?
          set -e
          cp "$RUNNER_TEMP/custody-policy.ts" src/custody-policy.ts
          test "$result" -eq 1
          node -e 'const r=require(process.argv[1]); const t=r.testResults.flatMap(f=>f.assertionResults).filter(t=>t.fullName.includes("suppresses protected directives") && t.status==="failed"); if(t.length!==3 || t.some(x=>!x.failureMessages.some(m=>m.includes("to be null")))) process.exit(1); console.log("separator regressions:", t.length)' "$RUNNER_TEMP/baseline.json"
          npx vitest run tests/custody-policy.test.ts -t 'suppresses protected directives'

  check:
    # Required status check on main. Renaming this changes the check context
    # and blocks every merge until the ruleset is updated to match.
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build the PR head itself, not GitHub's synthetic merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: node --test tests/package-artifact.test.mjs
      - name: Pack and validate installable package
        run: node scripts/retain-package.mjs "$RUNNER_TEMP/ci-wake-artifact"
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Retain validated package and provenance
        id: package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-wake-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-wake-artifact/
          if-no-files-found: error
          retention-days: 30
          overwrite: false
      - name: Record archive receipt
        env:
          ARTIFACT_ID: ${{ steps.package.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.package.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.package.outputs.artifact-digest }}
        run: |
          test -n "$ARTIFACT_ID" && test -n "$ARTIFACT_URL" && test -n "$ARTIFACT_DIGEST"
          {
            printf '## Retained package\n\nArtifact ID: `%s`\n\nURL: %s\n\nArchive SHA-256: `%s`\n\n' "$ARTIFACT_ID" "$ARTIFACT_URL" "$ARTIFACT_DIGEST"
            printf 'Requested retention: 30 days; verify actual expires_at through the artifact API.\n\n'
            printf 'Require this run/job to finish successfully. PR bundles are not merged-source or host acceptance.\n\n'
            printf '### Bundle checksums\n\n```text\n'
            cat "$RUNNER_TEMP/ci-wake-artifact/SHA256SUMS"
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"

  sdk-compat:
    name: SDK 2026.1106.0 compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      # Isolated fixture override; does not alter the lockfile or qualify installed bytes.
      - run: npm install --no-save --ignore-scripts @paperclipai/plugin-sdk@2026.1106.0 @paperclipai/shared@2026.1106.0
      - name: Verify exact SDK and shared versions
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          for (const name of ['plugin-sdk', 'shared']) {
            const pkg = JSON.parse(readFileSync(`node_modules/@paperclipai/${name}/package.json`, 'utf8'));
            if (pkg.version !== '2026.1106.0') throw new Error('unexpected SDK fixture version');
            console.log(`${pkg.name}@${pkg.version}`);
          }
          JS
      - run: npm run check
      - run: git diff --exit-code -- package.json package-lock.json
