# Pull-request size labels + required size gate (TogetherWeOwn standard;
# see STANDARD.md in TogetherWeOwn/.github, "Advisory PR-size labels" and
# "PR size gate").
#
# Thin caller: all logic lives once in the org `.github` repository
# (`.github/workflows/pr-size.yml`, `.github/workflows/pr-size-weekly.yml`,
# `.github/workflows/pr-size-gate.yml` and `.github/scripts/pr_size.py`) and
# runs from that repository at the pinned ref - this repo keeps no copy of
# the script. To adopt: copy this file to `.github/workflows/pr-size.yml`,
# repin all three `uses:` refs to the current TogetherWeOwn/.github `main`
# SHA, and set `exclude-extra` to this repo's generated paths.
#
# ADVISORY PART: never make `pr-size` a required check and never add it to
# a ruleset's required-workflows list. The labeller exits 0 on any API
# failure, and fork pull requests (read-only token) warn and skip.
#
# REQUIRED PART: `pr-size-gate` is the deliberate exception to that
# invariant - it FAILS pull requests too large for the automated reviewer
# and MUST be added to this repo's ruleset required-workflows list. Ship it
# in two steps (STANDARD.md: never require a check before its workflow
# exists on the default branch): first merge this caller and confirm the
# gate reports on the default branch, then add the check to the required
# list. The gate fails closed on measurement; fork pull requests within
# the gate pass (their warning comment is best-effort), while over-gate
# forks ERR (they cannot post the split comment or ensure the exception
# label) - that is intentional. The gate job also runs when the
# `size-exception` label is applied or removed or a review is submitted
# or dismissed, so granting an exception re-evaluates the check without
# a manual re-run - and revoking it re-runs and fails the gate, instead
# of leaving a stale passing check on the pull request.
#
# The weekly tally's schedule lives here, in the caller, because the tally
# is per-repository. It calls a SEPARATE reusable file so this job can stay
# read-only: GitHub checks a reusable workflow's nested-job permissions
# against the caller job's grant when parsing the workflow, ignoring `if:`,
# so each caller job below grants only what the file it calls requests.

name: pr-size

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed]
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Optional PR number to label and gate now (blank runs the weekly tally)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.pr_number || github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-size:
    name: pr-size
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review' || inputs.pr_number != ''
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: TogetherWeOwn/.github/.github/workflows/pr-size.yml@2ef8ad6447e11d019ac3098bcfd011193b75266a
    with:
      pr-number: ${{ inputs.pr_number || '' }}
      # This repo has no tracked generated paths beyond the script's
      # built-in lockfile/generated/fixture list (**/dist/**, **/fixtures/**,
      # lockfiles); dist/ is gitignored build output and never in the diff.
      exclude-extra: ""

  # REQUIRED: fails pull requests too large for the automated reviewer.
  # Add this check to the ruleset's required-workflows list after it has
  # reported on this repo's default branch (two-step ship, STANDARD.md).
  pr-size-gate:
    name: pr-size-gate
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review' || inputs.pr_number != ''
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: TogetherWeOwn/.github/.github/workflows/pr-size-gate.yml@2ef8ad6447e11d019ac3098bcfd011193b75266a
    with:
      pr-number: ${{ inputs.pr_number || '' }}
      exclude-extra: ""

  pr-size-weekly:
    name: pr-size-weekly
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.pr_number == '')
    permissions:
      contents: read
      issues: read
      pull-requests: read
    uses: TogetherWeOwn/.github/.github/workflows/pr-size-weekly.yml@2ef8ad6447e11d019ac3098bcfd011193b75266a
